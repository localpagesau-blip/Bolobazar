version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: deployment/Dockerfile.backend
    ports:
      - "8001:8001"
    volumes:
      - ./backend/bolobazaar.db:/app/backend/bolobazaar.db
    restart: unless-stopped

  voice-agent:
    build:
      context: .
      dockerfile: deployment/Dockerfile.voice
    ports:
      - "8000:8000"
    environment:
      - BACKEND_URL=http://backend:8001
    depends_on:
      - backend
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: deployment/Dockerfile.dashboard
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
